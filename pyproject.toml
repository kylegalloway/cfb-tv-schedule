[project]
name = "cfb-tv-schedule"
version = "0.1.0"
description = "Scrapes and serves the college football TV schedule."
authors = [
    { name = "Kyle Galloway", email = "kyle.galloway.1993@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "flask>=3.1.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live: hits the real network (fbschedules.com / ncaa.com); excluded by default, run explicitly with `-m live`",
]
addopts = "-m 'not live'"
